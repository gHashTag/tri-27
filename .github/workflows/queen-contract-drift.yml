name: Queen snapshot contract

# tri-27 is an extracted snapshot, not the live t27.ai source (trinity#974).
# Keep its page/recording check available on demand, without polling production
# or creating production-contract incidents from a stale local page.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    name: Local snapshot and committed recording only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the extracted Queen snapshot
        working-directory: apps/website
        run: npm run check:queen-snapshot
