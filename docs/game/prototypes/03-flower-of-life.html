<!doctype html>
<meta charset="utf-8">
<title>Queen map — flower of life, 27 trits per tile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap');
  :root{--bg:#000;--gold:#FFD700;--gold2:#d4af37;--cyan:#00CCFF;--green:#00FF88;--muted:#888}
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:'Outfit',system-ui,sans-serif;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:grab}canvas.drag{cursor:grabbing}
  .p{position:fixed;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.85;pointer-events:none}
  #hud{top:14px;left:16px;font-size:12px}#hud b{color:var(--gold);font-weight:500}
  .ok{color:var(--green)}.warn{color:#ff8a6b}
  #leg{bottom:14px;left:16px}#hint{bottom:14px;right:16px;color:rgba(255,255,255,.25)}
  .sw{display:inline-block;width:9px;height:9px;margin-right:7px;transform:rotate(45deg)}
</style>
<canvas id="c"></canvas>
<div id="hud" class="p">
  <div>FLOWER OF LIFE — <b id="nt">—</b> TILES · RING <b id="rk">2</b> · 1+3k(k+1)</div>
  <div>EACH TILE = ONE 27-TRIT WORD · <b id="nc">—</b> TRITS TOTAL</div>
  <div>DRAW <b id="dm">—</b> MS · P95 <b id="dp">—</b> MS · <span id="v" class="ok">—</span></div>
</div>
<div id="leg" class="p">
  <div><i class="sw" style="background:#FFD700"></i>+1 &nbsp;WORKING &nbsp;· OUTER RING = CPU</div>
  <div><i class="sw" style="background:#00CCFF"></i>&nbsp;0 &nbsp;IDLE &nbsp;&nbsp;&nbsp;&nbsp;· MIDDLE RING = FPGA</div>
  <div><i class="sw" style="background:#00FF88"></i>&nbsp;&minus;1 REFUSED · INNER RING = GPU</div>
</div>
<div id="hint" class="p">DRAG TO ORBIT · WHEEL TO ZOOM · 1-4 FLOWER RINGS</div>
<script>
const P=["M543.609 639.667L490.537 546.456L468.444 585.304L543.609 717.477V639.667Z","M489.786 545.199L438.209 453.966H393.861L467.788 584.09L489.786 545.199Z","M384.525 360.512L436.994 452.791L393.091 452.811L319.18 322.035L384.525 360.512Z","M319.922 320.841L385.231 358.858H489.638L468.408 320.815L319.922 320.841Z","M469.854 320.81L491.695 358.618L596.337 358.912L618.433 320.801L469.854 320.81Z","M703.129 359.011L598.207 358.965L619.983 321.06L767.697 321.125L703.129 359.011Z","M702.54 360.827L650.501 452.677L695.338 452.697L769.614 321.531L702.54 360.827Z","M598.155 544.433L620.701 584.062L694.724 453.922L649.575 453.972L598.155 544.433Z","M544.819 639.162L597.407 545.611L619.959 585.522L544.819 717.812V639.162Z","M543.946 567.149L511.486 510.031L491.755 544.962L543.946 636.825V567.149Z","M510.857 508.805L479.79 454.184H440.322L490.965 543.644L510.857 508.805Z","M479.052 452.892L447.096 396.758L387.857 362.23L439.599 453.267L479.052 452.892Z","M389.427 361.072L447.673 395.597L511.235 395.595L491.23 360.678L389.427 361.072Z","M512.836 395.557L576.043 395.537L595.834 360.751H492.923L512.836 395.557Z","M577.573 395.548L641.433 395.482L700.284 360.835H597.379L577.573 395.548Z","M641.979 396.644L609.958 452.951L649.135 452.858L700.736 362.59L641.979 396.644Z","M578.24 508.803L597.734 543.266L648.408 454.174L609.263 454.131L578.24 508.803Z","M545.483 567.025L577.45 510.047L597.043 544.548L545.483 635.215V567.025Z","M543.157 496.408L530.886 474.893L511.632 508.976L543.157 564.23V496.408Z","M510.799 507.831L530.268 473.478L519.428 454.358L480.586 454.341L510.799 507.831Z","M506.749 432.127L518.606 453.09L479.871 453.107L448.64 398.108L506.749 432.127Z","M507.208 431.026L530.649 431.016L511.365 397.077L449.27 397.105L507.208 431.026Z","M512.645 397.101L531.982 430.989H555.007L574.428 397.101H512.645Z","M580.435 431.079L556.539 431.069L575.922 397.106L638.353 397.134L580.435 431.079Z","M580.705 432.287L568.987 453.102L607.741 453.119L638.937 398.141L580.705 432.287Z","M576.766 507.787L557.383 473.503L568.216 454.334L607.09 454.317L576.766 507.787Z","M544.716 496.337L556.648 474.865L575.81 509.007L544.716 564.007V496.337Z"];
function parse(d){const t=d.match(/[MLHVZ]|-?\d*\.?\d+/g),p=[];let i=0,c='M',x=0,y=0;
  while(i<t.length){if(/[MLHVZ]/.test(t[i])){c=t[i++];if(c==='Z')break;continue}
  if(c==='H')x=+t[i++];else if(c==='V')y=+t[i++];else{x=+t[i++];y=+t[i++]}p.push([x,y])}return p}
const RAW=P.map(parse);
let a=1e9,b=1e9,cq=-1e9,dq=-1e9;
for(const g of RAW)for(const[x,y]of g){a=Math.min(a,x);b=Math.min(b,y);cq=Math.max(cq,x);dq=Math.max(dq,y)}
const S=Math.max(cq-a,dq-b),OX=(a+cq)/2,OY=(b+dq)/2;
const MARK=RAW.map(g=>g.map(([x,y])=>[(x-OX)/S,(y-OY)/S]));

// ---- FLOWER OF LIFE lattice -------------------------------------------------
// sacred.zig cmdFlower: "each ring adds 6k new circles (hexagonal symmetry)".
// total after k rings = 1 + 3k(k+1):  1, 7 (Seed), 19 (Flower), 37.
const R=110;                                  // circle radius == centre spacing
function flower(k){
  // Axial hex ring walk -> cartesian. Ring `ring` contributes exactly 6*ring
  // centres, so the total is 1 + 3k(k+1): 1, 7 (Seed), 19 (Flower), 37, 61.
  const out=[[0,0]];
  for(let ring=1;ring<=k;ring++){
    const dirs=[[-1,1],[-1,0],[0,-1],[1,-1],[1,0],[0,1]];
    let q=ring,r=0;
    for(const[dq2,dr]of dirs) for(let s=0;s<ring;s++){
      out.push([R*Math.sqrt(3)*(q+r/2), R*1.5*r]);
      q+=dq2;r+=dr;
    }
  }
  return out;
}

let K=2, tiles=[];
const TRIT=[-1,0,1], TCOL={'-1':'#00FF88','0':'#00CCFF','1':'#FFD700'};
const RINGCOL=['#FFD700','#00CCFF','#00FF88'];       // outer CPU, mid FPGA, inner GPU
function build(k){
  K=k; const pos=flower(k);
  tiles=pos.map(([x,y],i)=>({
    x,y,i,
    // the 27-trit word of this tile. Deterministic, not random: a balanced
    // ternary counter seeded by the tile index, so every tile differs and the
    // whole field is reproducible.
    word:Array.from({length:27},(_,j)=>TRIT[(i*7+j*5+((i*j)%3))%3]),
    phase:i*0.31,
  }));
  nt.textContent=tiles.length; rk.textContent=k; nc.textContent=tiles.length*27;
}

const cv=document.getElementById('c'),g=cv.getContext('2d',{alpha:false});
let W,H,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

let yaw=0,pitch=0.62,dist=1500,drag=null,auto=true;
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};auto=false;cv.classList.add('drag');cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag.x)*.006;
  pitch=Math.max(0.02,Math.min(1.5,pitch+(e.clientY-drag.y)*.005));drag={x:e.clientX,y:e.clientY}});
addEventListener('pointerup',()=>{drag=null;cv.classList.remove('drag')});
cv.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(200,Math.min(9000,dist*(1+e.deltaY*.0012)))},{passive:false});
addEventListener('keydown',e=>{if(/[1-4]/.test(e.key))build(+e.key)});

function proj(x,y,z){
  const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
  const X=x*cy+y*sy, Y2=-x*sy+y*cy;
  const Y=Y2*cp-z*sp, Z=Y2*sp+z*cp;
  const f=dist/(dist+Z+1100);
  return [W/2+X*f,H/2+Y*f,Z,f];
}

const draws=[];let t0=performance.now(),lastT=t0;
function frame(now){render(now);requestAnimationFrame(frame)}
function render(now){
  const dt=now-lastT;lastT=now;const d0=performance.now();
  if(auto)yaw+=0.00030*Math.min(dt,32);
  const t=(now-t0)/1000;
  g.fillStyle='#000';g.fillRect(0,0,W,H);

  const ord=tiles.map(tl=>{
    const live=tl.word.reduce((s,v)=>s+(v>0?1:0),0)/27;
    const lift=Math.sin(t*0.9+tl.phase)*.5+.5;
    const z=lift*30*live;
    return {tl,z,lift,live,d:proj(tl.x,tl.y,z)[2]};
  }).sort((p,q)=>q.d-p.d);

  // the flower substrate: the circles themselves, faint gold
  g.strokeStyle='rgba(212,175,55,.13)';g.lineWidth=1;
  for(const o of ord){
    const c=proj(o.tl.x,o.tl.y,0), rr=R*c[3];
    if(rr<3)continue;
    g.beginPath();g.ellipse(c[0],c[1],rr,rr*Math.cos(pitch),0,0,6.2832);g.stroke();
  }

  let px=0;
  for(const o of ord){
    const tl=o.tl,c=proj(tl.x,tl.y,o.z),w=R*1.15*c[3];
    px=Math.max(px,w);
    if(c[0]<-w||c[0]>W+w||c[1]<-w||c[1]>H+w)continue;

    if(w<10){                                    // LOD0 — one lit point
      g.globalAlpha=.25+.6*o.live;g.fillStyle=TCOL['1'];
      g.beginPath();g.arc(c[0],c[1],Math.max(1,w*.18),0,6.2832);g.fill();g.globalAlpha=1;continue;
    }
    if(w<46){                                    // LOD1 — three nested triads
      g.globalAlpha=.30+.5*o.live*o.lift;g.lineWidth=Math.max(.6,w/40);
      for(let r=0;r<3;r++){
        g.strokeStyle=RINGCOL[r];const s=w*(.30-r*.083);
        g.beginPath();
        for(let k2=0;k2<3;k2++){const an=-Math.PI/2+k2*2.0944;
          const X=c[0]+Math.cos(an)*s,Y=c[1]+Math.sin(an)*s;k2?g.lineTo(X,Y):g.moveTo(X,Y)}
        g.closePath();g.stroke();
      }
      g.globalAlpha=1;continue;
    }
    // LOD2 — the mark, one petal per trit of the tile's 27-trit word
    const sc=w*.80;
    for(let i=0;i<27;i++){
      const pts=MARK[i],ring=(i/9)|0,trit=tl.word[i];
      g.beginPath();
      for(let k2=0;k2<pts.length;k2++){
        const X=c[0]+pts[k2][0]*sc,Y=c[1]+pts[k2][1]*sc;k2?g.lineTo(X,Y):g.moveTo(X,Y)}
      g.closePath();
      // hue says WHICH RING (cpu/fpga/gpu); value says WHICH TRIT (-1/0/+1)
      g.fillStyle=RINGCOL[ring];
      g.globalAlpha=trit>0?(.55+.35*o.lift):trit===0?.18:.05;
      g.fill();
      if(trit===0){g.globalAlpha=.42;g.lineWidth=Math.max(.4,w/260);
        g.strokeStyle=RINGCOL[ring];g.stroke()}
      g.globalAlpha=1;
    }
  }
  const dms=performance.now()-d0;
  draws.push(dms);if(draws.length>180)draws.shift();
  if(draws.length>20){
    const s=[...draws].sort((x,y)=>x-y),m=s[s.length>>1],p=s[Math.floor(s.length*.95)];
    dm.textContent=m.toFixed(2);dp.textContent=p.toFixed(2);
    v.textContent=p<=8.33?('CANVAS2D HOLDS — '+(p/8.33*100).toFixed(0)+'%'):'OVER BUDGET';
    v.className=p<=8.33?'ok':'warn';
  }
  return dms;
}
const nt=document.getElementById('nt'),nc=document.getElementById('nc'),rk=document.getElementById('rk'),
      dm=document.getElementById('dm'),dp=document.getElementById('dp'),v=document.getElementById('v');
build(K);requestAnimationFrame(frame);
const q=(A,p)=>{const s=[...A].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(s.length*p))]};
window.__bench=(k,iters=150,warm=40)=>{
  build(k);dist=Math.max(700,(k+1)*R*4.2);yaw=.3;pitch=.62;auto=false;
  const base=performance.now();
  for(let i=0;i<warm;i++)render(base+i*8.33);
  const s=[];for(let i=0;i<iters;i++)s.push(render(base+(warm+i)*8.33));
  s.sort((x,y)=>x-y);
  return {rings:k,tiles:tiles.length,formula:'1+3k(k+1)='+(1+3*k*(k+1)),trits:tiles.length*27,
    median:+s[s.length>>1].toFixed(3),p95:+s[Math.floor(s.length*.95)].toFixed(3),
    pct:+(s[Math.floor(s.length*.95)]/8.33*100).toFixed(1)};
};
</script>
